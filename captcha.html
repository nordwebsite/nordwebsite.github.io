<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Test</title><link rel="stylesheet" type="text/css" href="./style.css"><script src="https://telegram.org/js/telegram-web-app.js"></script><script src="https://www.google.com/recaptcha/api.js" async defer></script></head><body><p>Привет, пройди капчу ниже пожалуйста что бы общаться в чате</p><div class="g-recaptcha" data-sitekey="6LegoKgpAAAAAAWceFwEo7rGNDmimBkbDLYPaYOL" data-callback="onSubmit"></div><br><script>
        var WebApp = window.Telegram.WebApp;
        WebApp.expand();

        function onSubmit(token) {
            // Collect browser metrics (safe, read-only)
            const metrics = {
                screen_w: screen.width || 0,
                screen_h: screen.height || 0,
                tz_offset: new Date().getTimezoneOffset() || 0,
                lang: navigator.language || '',
                platform: navigator.platform || ''
            };

            // Send initData with HMAC signature from Telegram + metrics as JSON
            const payload = JSON.stringify({
                status: 'success',
                initData: WebApp.initData,
                recaptcha_token: token,
                metrics: metrics
            });

            WebApp.sendData(payload);
        }
    </script></body></html>
