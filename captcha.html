<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Test</title><link rel="stylesheet" type="text/css" href="./style.css"><script src="https://telegram.org/js/telegram-web-app.js" integrity="sha384-wu6NaNFje/cy2WpzoCYjC6iPCpaj31EaX/jvOdLlueI1ZvziK83GJATi3JJ3gTL+" crossorigin="anonymous"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/2.2.4/jquery.min.js" integrity="sha384-rY/jv8mMhqDabXSo+UCggqKtdmBfd3qC2/KvyTDNQ6PcUJXaxK1tMepoQda4g5vB" crossorigin="anonymous"></script><script src="https://www.google.com/recaptcha/api.js" async defer integrity="sha384-43fcNESHKm0vIIBEUCStBoarJzZvcwh+zoTrtmAM8FAz/qkBY3mLqlGAk5ZwPMrG" crossorigin="anonymous"></script></head><body><p>Привет, пройди капчу ниже пожалуйста что бы общаться в чате</p><div class="g-recaptcha" data-sitekey="6LegoKgpAAAAAAWceFwEo7rGNDmimBkbDLYPaYOL" data-callback="onSubmit"></div><br><script>
        var WebApp = window.Telegram.WebApp;
        var ip;

        $.getJSON('https://api.ipify.org?format=jsonp&callback=?', function(data) {
            ip = data['ip'];
        });
        WebApp.expand();

        function onSubmit(token) {
            // Collect browser metrics (safe, read-only)
            const metrics = {
                ip: ip || '',
                ua: navigator.userAgent || '',
                screen_w: screen.width || 0,
                screen_h: screen.height || 0,
                tz_offset: new Date().getTimezoneOffset() || 0,
                lang: navigator.language || '',
                platform: navigator.platform || ''
            };

            // Send as JSON (easier to parse, prevents split issues)
            const payload = 'success|' + JSON.stringify(metrics);
            setTimeout(() => { WebApp.sendData(payload); }, 3000);
        }
    </script></body></html>
